name: US Macro Daily & Weekly Bot

on:
  schedule:
    - cron: '40 21 * * 1-5' # 화~토 06:40 KST 미국 증시 데일리 브리핑
    - cron: '10 7 * * 1-5'  # 월~금 16:10 KST 한국 증시 마감 브리핑 (삼성전자·SK하이닉스)
    - cron: '30 10 * * 0'   # 일요일 19:30 KST 주간 특징주 & 캘린더
    - cron: '0 12 * * 6'    # 토요일 21:00 KST 주말 신규 구독자 동기화
    - cron: '0 12 * * 1'    # 월요일 21:00 KST 월요일 신규 구독자 동기화
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 종류 (daily, kr, weekly, sync)'
        required: true
        default: 'daily'

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Fonts & Packages (Briefing Mode)
        if: github.event.schedule != '0 12 * * 6' && github.event.schedule != '0 12 * * 1' && inputs.mode != 'sync'
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Install Lightweight Packages (Subscriber Sync Mode)
        if: github.event.schedule == '0 12 * * 6' || github.event.schedule == '0 12 * * 1' || inputs.mode == 'sync'
        run: |
          pip install requests python-dotenv

      - name: Run Briefing or Subscriber Sync
        run: |
          if [ "${{ github.event.schedule }}" = "0 12 * * 6" ] || [ "${{ github.event.schedule }}" = "0 12 * * 1" ] || [ "${{ inputs.mode }}" = "sync" ]; then
            python subscriber_manager.py --sync-only
          elif [ "${{ github.event.schedule }}" = "10 7 * * 1-5" ] || [ "${{ inputs.mode }}" = "kr" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              python kr_briefing.py --broadcast --skip-if-holiday
            else
              python kr_briefing.py --broadcast
            fi
          elif [ "${{ github.event.schedule }}" = "30 10 * * 0" ] || [ "${{ inputs.mode }}" = "weekly" ]; then
            python weekly_featured.py --broadcast
            python weekly_calendar.py --broadcast
          else
            python main.py --broadcast
          fi

      - name: Sync Subscribers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscribers.json
          git diff --staged --quiet || (git commit -m "chore: sync subscribers" && git push)
